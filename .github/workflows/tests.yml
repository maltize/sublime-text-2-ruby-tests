name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    # Python 3.8 is available on Ubuntu 22.04; newer Ubuntu images omit it.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        python-version: ['3.8', '3.12', '3.14']
        include:
          - os: windows-2022
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: gem install minitest --no-document
      - if: runner.os != 'Windows'
        run: python -W error -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: python -W error -m unittest discover -s tests -p test_shell_commands.py -v
